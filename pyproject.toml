[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "squares-in-squares-vis"
version = "0.1.0"
description = "Interactive viewer for 'Squares in Squares' (Kaggle) submission files: one self-contained HTML page for all 1000 packings."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.10"
authors = [{ name = "Rusiek" }]
keywords = ["kaggle", "square-packing", "visualization", "plotly"]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: Apache Software License",
               "Topic :: Scientific/Engineering :: Visualization"]
dependencies = ["numpy>=1.26", "pandas>=2.2.2", "plotly>=5.18"]

[project.optional-dependencies]
preview = ["matplotlib>=3.8"]
test = ["pytest>=8", "matplotlib>=3.8"]

[project.scripts]
sis-vis = "squares_in_squares_vis.viewer:main"

[project.urls]
Homepage = "https://github.com/Rusiek/squares-in-squares-vis"
Competition = "https://www.kaggle.com/competitions/squares-in-squares"

[tool.hatch.build.targets.wheel]
packages = ["src/squares_in_squares_vis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
